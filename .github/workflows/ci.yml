name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sadi_ci
          POSTGRES_USER: sadi_ci
          POSTGRES_PASSWORD: sadi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sadi_ci -d sadi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "false"
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: sadi_ci
      DATABASE_USER: sadi_ci
      DATABASE_PASSWORD: sadi_ci
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_SSLMODE: disable
      TEST_DATABASE_NAME: sadi_ci_test
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff (backend lint)
        run: python -m ruff check accesos accesosen_api
      - name: Black (format check)
        run: python -m black --check accesos/auth_jwt.py accesos/jwt_views.py accesos/rate_limit.py accesos/otp_services.py
      - name: Django checks
        run: python manage.py check
      - name: Tests with coverage
        run: pytest --create-db --cov=accesos --cov-report=term-missing --cov-fail-under=30

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Guardrail (no browser popups)
        run: |
          ! grep -REn "\b(alert|confirm|prompt)\s*\(" src --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Expo RN)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile-rn/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
