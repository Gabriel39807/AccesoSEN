services:
  - type: web
    name: sadi-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: services/api
    autoDeploy: true
    healthCheckPath: /ready/
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate --noinput
      gunicorn accesosen_api.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TIMEZONE
        value: America/Bogota
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_ENGINE
        value: django.db.backends.postgresql
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_USE_PGBOUNCER
        value: "true"
      - key: DATABASE_CONN_MAX_AGE
        value: "0"
      - key: CACHE_BACKEND
        value: database
      - key: CACHE_TABLE
        value: django_cache
      - key: CACHE_DEFAULT_TIMEOUT
        value: "300"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "14"
      - key: JWT_ROTATE_REFRESH_TOKENS
        value: "true"
      - key: JWT_BLACKLIST_AFTER_ROTATION
        value: "true"
      - key: JWT_UPDATE_LAST_LOGIN
        value: "true"
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: GUARDA_SINGLE_ACTIVE_SESSION
        value: "true"
      - key: DOMAIN_POLICY_EXEMPT_SUPERADMIN
        value: "false"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_WINDOW_SEC
        value: "900"
      - key: LOGIN_PROGRESSIVE_LOCKOUT_SECONDS
        value: 60,180,300,900,1800
      - key: LOGIN_IP_LOCK_SEC
        value: "60"
      - key: REPEATED_LOCKOUT_THRESHOLD
        value: "5"
      - key: REPEATED_LOCKOUT_WINDOW_HOURS
        value: "24"
      - key: WEBAUTHN_MOCK
        value: "false"
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_RP_NAME
        value: SADI
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "true"
      - key: USE_X_FORWARDED_PROTO
        value: "true"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DEFAULT_SUPERADMIN_AUTO_CREATE
        value: "false"
